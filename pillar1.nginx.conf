# =============================================================================
# Pillar 1 Nginx Reverse Proxy Configuration
# Deploy to: /etc/nginx/sites-available/pillar1
# Enable with: sudo ln -s /etc/nginx/sites-available/pillar1 /etc/nginx/sites-enabled/
# =============================================================================

upstream pillar1_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    # Client body limit (adjust if uploading large files)
    client_max_body_size 50M;

    # Gzip compression for API responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Forward all requests to FastAPI
    location / {
        proxy_pass http://pillar1_backend;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running scraping queries
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for live streaming progress if needed
        proxy_buffering off;
    }

    # Dedicated location for health check
    location /health {
        proxy_pass http://pillar1_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
